services:
  postgres:
    image: postgres:15-alpine
    container_name: logistics_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: logistics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: logistics_server
    restart: always
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/logistics_db?schema=public"
      JWT_SECRET: "super-secure-production-jwt-secret-key-351002"
      JWT_EXPIRES_IN: "7d"
      OSRM_API_URL: "http://router.project-osrm.org"
      CLIENT_URL: "http://localhost"

  client:
    build: ./client
    container_name: logistics_client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  postgres_data:
